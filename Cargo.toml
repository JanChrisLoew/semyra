[package]
name = "marklive"
version = "0.2.0"
edition = "2021"
description = "Nativer Windows 11 Markdown-Editor mit Live-Vorschau"
license = "MIT"
authors = ["MarkLive"]

[[bin]]
name = "MarkLive"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
window-vibrancy = "0.8"
rfd = "0.17"
notify = "8.0"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "1.1"
mime_guess = "2.0"
percent-encoding = "2.3"
dirs = "5.0"
base64 = "0.22"
trash = "5.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
