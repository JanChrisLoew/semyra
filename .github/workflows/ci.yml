name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build, Test & Verify Installer (Windows x64 + ARM64 Check)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck, test, and build frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Run Playwright E2E & Accessibility tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Verify ARM64 compilation (cargo check)
        run: cargo check --locked --target aarch64-pc-windows-msvc

      - name: Build standalone Semyra.exe (Release)
        run: cargo build --release --locked

      - name: Build x64 Inno Setup Installer
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Architecture x64

      - name: Verify x64 Installer and Uninstaller
        shell: pwsh
        timeout-minutes: 3
        run: .\scripts\Test-Installer.ps1

      - name: Checkout installer upgrade baseline
        uses: actions/checkout@v4
        with:
          # Baseline release with the current Explorer registration.
          ref: v0.2.0
          path: target/installer-baseline
          persist-credentials: false

      - name: Build x64 baseline installer
        shell: pwsh
        working-directory: target/installer-baseline
        run: |
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Build-Installer.ps1 -Architecture x64

      - name: Verify x64 Installer Upgrade
        shell: pwsh
        timeout-minutes: 3
        run: |
          .\scripts\Test-Installer.ps1 `
            -BaselineInstaller target/installer-baseline/target/installer/Semyra-Setup-x64.exe `
            -BaselineExe target/installer-baseline/target/release/Semyra.exe

      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Semyra-Installer-Test-Logs
          path: target/installer-test/*.log
          if-no-files-found: ignore

      - name: Upload Semyra.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semyra-win11-x64
          path: target/release/Semyra.exe

      - name: Build ARM64 Release & Stage Release Assets (on tag release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          cargo build --release --locked --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Build-Installer.ps1 -Architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $outDir = "target/release-assets"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "target/installer/Semyra-Setup-x64.exe" "$outDir/Semyra-Setup-x64.exe" -Force
          Copy-Item "target/installer/Semyra-Setup-arm64.exe" "$outDir/Semyra-Setup-arm64.exe" -Force
          Copy-Item "target/release/Semyra.exe" "$outDir/Semyra-x64.exe" -Force
          Copy-Item "target/aarch64-pc-windows-msvc/release/Semyra.exe" "$outDir/Semyra-arm64.exe" -Force
          $lines = Get-ChildItem "$outDir/*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path (Resolve-Path $outDir) "SHA256SUMS.txt"), $lines)

      - name: Upload x64 Installer artifact (on tag release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Semyra-Setup-x64
          path: target/installer/Semyra-Setup-x64.exe

      - name: Publish GitHub Release (on tag release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release-assets/Semyra-Setup-x64.exe
            target/release-assets/Semyra-Setup-arm64.exe
            target/release-assets/Semyra-x64.exe
            target/release-assets/Semyra-arm64.exe
            target/release-assets/SHA256SUMS.txt
