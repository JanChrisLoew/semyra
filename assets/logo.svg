<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="96" height="96" role="img" aria-label="Semyra Logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19202B" />
      <stop offset="50%" stop-color="#151A22" />
      <stop offset="100%" stop-color="#1D2633" />
    </linearGradient>
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#090C10" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Windows 11 Fluent Badge -->
  <rect x="15" y="15" width="226" height="226" rx="52" fill="url(#bg)" stroke="#323E4D" stroke-width="3" filter="url(#shadow)" />
  <path d="M67 16.5 H189 A50.5 50.5 0 0 1 239.5 67 V72 H16.5 V67 A50.5 50.5 0 0 1 67 16.5 Z" fill="url(#topSheen)" />

  <!-- Geometric S-Monogram (Crisp Ice White #EEF3F7) -->
  <g fill="#EEF3F7">
    <!-- Top horizontal bar -->
    <rect x="76.8" y="66.5" width="84.5" height="23" rx="3" />
    <!-- Upper-left vertical spine -->
    <rect x="76.8" y="84.5" width="25.6" height="48.6" rx="3" />
    <!-- Middle horizontal bar -->
    <rect x="76.8" y="117.7" width="107.5" height="23" rx="3" />
    <!-- Lower-right vertical spine -->
    <rect x="158.7" y="125.4" width="25.6" height="48.6" rx="3" />
    <!-- Bottom horizontal bar -->
    <rect x="76.8" y="166.4" width="107.5" height="23" rx="3" />
  </g>

  <!-- Steel Blue Accent Block (#83A5C6) -->
  <rect x="166.5" y="66.5" width="17.8" height="23" rx="3" fill="#83A5C6" />
</svg>
